# /etc/z380m/gui/xorg.conf - Xorg on the Z380M: the kernel framebuffer (mtkfb) + the touchscreen, no udev, no GLX
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowEmptyInput" "true"
    Option "DontZap" "true"
EndSection

Section "Module"
    Disable "glx"
EndSection

Section "Device"
    Identifier "fb0"
    Driver "fbdev"
    VendorName "kaantcp"
    BoardName "z380m-alpine https://github.com/kaantcp"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "panel"
    VendorName "kaantcp"
    ModelName "z380m-alpine https://github.com/kaantcp"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "fb0"
    Monitor "panel"
    DefaultDepth 24
    DefaultFbBpp 32
    SubSection "Display"
        Depth 24
        FbBpp 32
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "touch0"
    Driver "evdev"
    # /dev/input/z380m-touch is a symlink that z380m-gui makes to the elan touch screen (event11 on the tablet)
    Option "Device" "/dev/input/z380m-touch"
EndSection

Section "ServerLayout"
    Identifier "z380m"
    Screen 0 "screen0" 0 0
    InputDevice "touch0" "CorePointer"
EndSection
